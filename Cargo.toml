[workspace]
members = ["crates/*", "tooling/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
circuit = { path = "crates/circuit" }
common = { path = "crates/common" }
field = { path = "crates/field" }
host = { path = "crates/host" }
pcs = { path = "crates/pcs" }
poly = { path = "crates/poly" }
prover = { path = "crates/prover" }
transcript = { path = "crates/transcript" }
verifier = { path = "crates/verifier" }
gkr = { path = "crates/gkr"}

aes = "0.9.2"
anyhow = "1.0.93"
argh = "0.1.12"
binius-field = { git = "https://github.com/IrreducibleOSS/binius64.git", rev = "49deecec1bf691c57aeadcda2499316d8094fcd8" }
bincode = "1.3.3"
blake3 = "1.8.6"
bytemuck = "1.25"
crypto-bigint = "0.7.5"
crypto-primitives = { git = "https://github.com/NethermindEth/crypto-primitives.git", rev = "3c4232b", features = ["rand"] }
crypto-primitives-proc-macros = { git = "https://github.com/NethermindEth/crypto-primitives.git", rev = "3c4232b" }
divan = "0.1.21"
flock-core = { git = "https://github.com/succinctlabs/flock.git", rev = "879072249e52b8b9054bf0c6a034cec20f8f6fc7" }
num-bigint = "0.4"
num-traits = "0.2"
proptest = "1.11.0"
rand = "0.10"
rand_chacha = "0.10"
rand_core = "0.10"
rand_pcg = "0.10"
rayon = "1.10"
spongefish = "0.7.4"
thiserror = "2.0"



# Benchmark parity: without these, kernels lose cross-unit inlining.
[profile.release]
lto = true
codegen-units = 1

# Keep debug symbols and disable cross-crate LTO for profiling.
# Use the release profile for benchmark timings.
[profile.profiling]
inherits = "release"
debug = true
# Bundle macOS debug information into a .dSYM for samply.
split-debuginfo = "packed"
lto = false
codegen-units = 16
