[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rayon = "1.10"

# Benchmark parity: without these, kernels lose cross-unit inlining.
[profile.release]
lto = true
codegen-units = 1
