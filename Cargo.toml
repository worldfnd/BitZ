[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
common = { path = "crates/common" }
field = { path = "crates/field" }
host = { path = "crates/host" }
pcs = { path = "crates/pcs" }
poly = { path = "crates/poly" }
prover = { path = "crates/prover" }
transcript = { path = "crates/transcript" }
verifier = { path = "crates/verifier" }
gkr = { path = "crates/gkr"}

aes = "0.9.2"
binius-field = { git = "https://github.com/IrreducibleOSS/binius64.git", rev = "49deecec1bf691c57aeadcda2499316d8094fcd8" }
bincode = "1.3.3"
blake3 = "1.8.6"
bytemuck = "1.25"
crypto-bigint = "0.7.5"
crypto-primitives = { git = "https://github.com/NethermindEth/crypto-primitives.git", rev = "3c4232b", features = ["rand"] }
crypto-primitives-proc-macros = { git = "https://github.com/NethermindEth/crypto-primitives.git", rev = "3c4232b" }
divan = "0.1.21"
flock-core = { git = "https://github.com/succinctlabs/flock.git", rev = "879072249e52b8b9054bf0c6a034cec20f8f6fc7" }
num-bigint = "0.4"
num-traits = "0.2"
proptest = "1.11.0"
rand = "0.10"
rand_chacha = "0.9"
rand_core = "0.9"
rand_pcg = "0.9"
rayon = "1.10"
spongefish = "0.7.4"
thiserror = "2.0"



# Benchmark parity: without these, kernels lose cross-unit inlining.
# debug = true keeps symbols for samply without changing codegen.
# split-debuginfo = "packed" bundles a .dSYM so samply can read source/line
# info (macOS's default "unpacked" mode leaves DWARF in per-CGU .o files that
# samply doesn't follow via the OSO indirection).
[profile.release]
lto = true
codegen-units = 1

# Same as release, but without whole-program LTO / a single codegen unit:
# those collapse call boundaries across the whole crate graph, which makes a
# sampling profiler attribute time to the wrong (or a merged) frame. Use this
# profile when profiling instead of `release`; it isn't representative of the
# real benchmark numbers, only of where time goes.
[profile.profiling]
inherits = "release"
debug = true
split-debuginfo = "packed"
