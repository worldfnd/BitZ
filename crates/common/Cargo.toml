[package]
name = "common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
# Exposes private kernels to `benches/`; not part of the public API.
bench = []

[dependencies]
crypto-primitives = { workspace = true }
bytemuck = {workspace = true}
field = { workspace = true, features = ["spongefish"] }
spongefish = { workspace = true }
poly = { workspace = true }
rayon = { workspace = true, optional = true }
num-traits = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
rand = { workspace = true }

[[bench]]
name = "table"
harness = false
required-features = ["bench"]
