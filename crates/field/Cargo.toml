[package]
name = "field"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
num-traits = { workspace = true }
crypto-primitives = { workspace = true }
crypto-primitives-proc-macros = { workspace = true }
spongefish = { version = "0.7.4", default-features = false, optional = true }

[features]
spongefish = ["dep:spongefish"]

[dev-dependencies]
aes = "0.9.2"
binius-field = { git = "https://github.com/IrreducibleOSS/binius64.git", rev = "49deecec1bf691c57aeadcda2499316d8094fcd8" }
divan = "0.1.21"
flock-core = { workspace = true }
rand_core = "0.9"
rand_pcg = "0.9"

[[bench]]
name = "gf128"
harness = false

[[bench]]
name = "binius64"
harness = false
