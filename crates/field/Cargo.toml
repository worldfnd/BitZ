[package]
name = "field"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
num-traits = { workspace = true }
crypto-primitives = { workspace = true }
crypto-primitives-proc-macros = { workspace = true }
# Not inherited: `transcript` needs spongefish with its default features and
# this crate needs it without them. Cargo refuses to override
# `default-features` in either direction once the workspace fixes it.
spongefish = { version = "0.7.4", default-features = false, optional = true }

[features]
spongefish = ["dep:spongefish"]

[dev-dependencies]
aes = { workspace = true }
binius-field = { workspace = true }
divan = { workspace = true }
flock-core = { workspace = true }
rand_core = { workspace = true }
rand_pcg = { workspace = true }

[[bench]]
name = "gf128"
harness = false

[[bench]]
name = "binius64"
harness = false
